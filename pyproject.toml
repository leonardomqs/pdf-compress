[project]
name = "pdf-compress"
version = "0.1.0"
description = "Compressão de PDFs via Ghostscript, com scripts e notebooks de apoio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf2>=3.0.1",
    "numpy>=1.26",
]

[project.scripts]
pdf-compress = "pdf_compressor:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pdf_compressor.py"]
