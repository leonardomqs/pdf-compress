[project]
name = "pdf-compress"
version = "0.1.0"
description = "Compressão, junção e rotação de PDFs via Ghostscript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf2>=3.0.1",
]

[project.scripts]
pdf-compress = "pdf_compressor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pdf_compressor.py"]
